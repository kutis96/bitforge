<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bitforge</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <noscript><p>bitforge needs JavaScript enabled.</p></noscript>

  <header id="toolbar">
    <div class="brand">bitforge</div>
    <div class="fileops">
      <button id="btn-new" type="button" title="New blank font (prompts for width &amp; height)">New</button>
      <button id="btn-open" type="button" title="Import a PNG atlas (16x16)">Open PNG</button>
      <button id="btn-export-png" type="button" title="Export a PNG atlas (16x16)">Export PNG</button>
      <button id="btn-export-verilog" type="button" title="Export a Verilog $readmemb ROM">Export Verilog</button>
      <button id="btn-open-bdf" type="button" title="Import a BDF font (first face)">Open BDF</button>
      <button id="btn-export-bdf" type="button" title="Export a BDF font (single face, 256 codes)">Export BDF</button>
      <button id="btn-copy-glyph" type="button" title="Copy the current glyph as a PNG to the clipboard (16&times;, transparent background); downloads if the clipboard is unavailable">Copy glyph</button>
      <label id="png-bg-label" title="Background for PNG export">
        <input type="checkbox" id="chk-png-transparent"> transparent bg
      </label>
      <input id="file-png" type="file" accept="image/png" hidden>
      <input id="file-bdf" type="file" accept=".bdf,text/plain" hidden>
    </div>
    <button id="btn-keys" type="button" title="Keyboard shortcuts (?)">?</button>
    <div id="dims" class="dims">W:8 H:16</div>
  </header>

  <div id="keys-card" class="keys-card" hidden>
    <div class="keys-head"><b>Keyboard shortcuts</b><button id="btn-keys-close" type="button" title="Close">&#215;</button></div>
    <ul id="keys-list"></ul>
  </div>

  <main id="layout">
    <aside id="sidebar">
      <div id="sel-header" class="sel-header">0x00</div>
      <div class="jumprow">
        <input id="jump" type="text" placeholder="hex or char" spellcheck="false" autocomplete="off" aria-label="Jump to glyph">
        <button id="btn-jump" type="button">Go</button>
      </div>
      <canvas id="selector" title="Click a glyph to select it" aria-label="Glyph selector (256 glyphs, 16 by 16; click to select)"></canvas>
    </aside>

    <section id="content">
      <nav id="tabs" role="tablist">
        <button class="tab active" data-tab="edit" type="button" role="tab">Edit</button>
        <button class="tab" data-tab="preview" type="button" role="tab">Preview</button>
        <button class="tab" data-tab="atlas" type="button" role="tab">Atlas</button>
        <button class="tab" data-tab="qa" type="button" role="tab">QA</button>
      </nav>

      <div class="panel active" id="panel-edit" role="tabpanel">
        <div class="panel-head">
          <span id="edit-label">glyph</span>
          <span class="spacer"></span>
          <span id="glyph-status" class="glyph-status" title="Status of the current glyph (also: right-click a glyph in the Atlas tab)">
            <button id="st-unfinished" type="button" data-st="0" title="Mark as unfinished">unf</button>
            <button id="st-wip" type="button" data-st="1" title="Mark as WIP">wip</button>
            <button id="st-done" type="button" data-st="2" title="Mark as done">done</button>
          </span>
          <button id="btn-undo" type="button" title="Undo (Ctrl/&#8984;+Z)">&#8592; Undo</button>
          <button id="btn-redo" type="button" title="Redo (Ctrl/&#8984;+Shift+Z)">&#8594; Redo</button>
          <button id="btn-clear" type="button">Clear glyph</button>
        </div>
        <div id="guides" class="guides">
          <label class="glock" title="Lock all guidelines (locked = cannot drag to move)"><input type="checkbox" id="glock" checked> lock</label>
          <span class="gadd" title="Add guidelines at preset positions (drag them once unlocked)">
            <button type="button" data-g="ascender">asc</button>
            <button type="button" data-g="cap">cap</button>
            <button type="button" data-g="xheight">x</button>
            <button type="button" data-g="baseline">base</button>
            <button type="button" data-g="descender">desc</button>
            <button type="button" data-g="left">|L</button>
            <button type="button" data-g="right">|R</button>
            <button type="button" data-g="hnew">+H</button>
            <button type="button" data-g="vnew">+V</button>
          </span>
          <span id="glist" class="glist" title="Current guidelines (x to remove)"></span>
        </div>
        <div class="canvas-wrap"><canvas id="editor"></canvas></div>
      </div>

      <div class="panel" id="panel-preview" role="tabpanel">
        <div class="panel-head">
          <label>Scale <input id="pv-scale" type="range" min="1" max="16" value="8"></label>
          <label><input id="pv-bold" type="checkbox"> bold</label>
          <label><input id="pv-italic" type="checkbox"> italic</label>
          <label>baseline <input id="pv-baseline" type="number" min="0" step="1" value="5"></label>
          <label title="Preview surfaces only (white on black); the editor stays black on white"><input id="pv-inverted" type="checkbox"> inverted</label>
        </div>
        <div class="preview-grid">
          <div class="canvas-wrap"><canvas id="pv-glyph"></canvas></div>
          <div class="textcol">
            <textarea id="pv-text" spellcheck="false"
              placeholder="Type text…  *bold*  _italic_  \u41  \*  (markups nest; \ escapes: \* \_ \\)"></textarea>
            <div class="canvas-wrap"><canvas id="pv-text-canvas"></canvas></div>
          </div>
        </div>
      </div>

      <div class="panel" id="panel-atlas" role="tabpanel">
        <div class="panel-head"><span>all 256 glyphs (0x00 top-left → 0xFF bottom-right) · click to select · right-click to set status</span></div>
        <div class="canvas-wrap"><canvas id="atlas"></canvas></div>
      </div>

      <div class="panel" id="panel-qa" role="tabpanel">
        <div class="panel-head">
          <button id="btn-qa-refresh" type="button">Refresh checks</button>
          <span id="qa-badge" class="qa-badge" hidden></span>
          <span class="spacer"></span>
          <span class="qa-hint">checks run on demand; the report goes stale when the font changes</span>
        </div>
        <div id="qa-table-wrap" class="qa-table-wrap">
          <div id="qa-empty" class="qa-empty">Press <b>Refresh checks</b> to run the QA checks.</div>
          <table id="qa-table" hidden>
            <thead><tr><th>check</th><th>codes</th><th>detail</th></tr></thead>
            <tbody id="qa-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
